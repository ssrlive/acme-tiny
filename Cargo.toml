[package]
name = "acme-tiny"
version = "0.1.3"
edition = "2024"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
hex = "0.4.3"
log = "0.4.29"
regex = "1.12.2"
reqwest = { version = "0.13.1", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["full"] }

[build-dependencies]
chrono = "0.4.42"
